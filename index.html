<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fruit Ninja 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #1a0a2e;
      font-family: 'Segoe UI', Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; touch-action: none; }

    /* HUD */
    #hud {
      position: fixed;
      top: 2.5vh;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
      text-align: center;
    }
    #score-label {
      font-size: clamp(2.5vmin, 5vw, 5vmin);
      color: #fff;
      font-weight: bold;
      text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    }
    #combo-label {
      font-size: clamp(1.5vmin, 3vw, 3vmin);
      color: #ffdd57;
      font-weight: bold;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
      opacity: 0;
      transition: opacity 0.3s;
    }
    #miss-label {
      position: fixed;
      top: 2.5vh;
      right: 2.5vw;
      font-size: clamp(2vmin, 4vw, 4vmin);
      color: #ff4444;
      font-weight: bold;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
      z-index: 10;
      pointer-events: none;
    }

    /* Menus */
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }
    .overlay h1 {
      font-size: clamp(4vmin, 8vw, 8vmin);
      color: #fff;
      margin-bottom: 1vmin;
      text-shadow: 0 4px 20px rgba(255,100,0,0.5);
    }
    .overlay h2 {
      font-size: clamp(2vmin, 4vw, 4vmin);
      color: #ffdd57;
      margin-bottom: 4vmin;
    }
    .overlay button {
      display: block;
      margin: 1vmin;
      padding: 1.5vmin 4vmin;
      font-size: clamp(2vmin, 3vw, 3vmin);
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #ff6b35, #e8272c);
      border: none;
      border-radius: 3vmin;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 15px rgba(255,80,30,0.4);
    }
    .overlay button:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 25px rgba(255,80,30,0.6);
    }

    /* Blade trail canvas */
    #trail-canvas {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    #btn-mute {
      position: fixed;
      bottom: 2vmin;
      right: 2vmin;
      z-index: 30;
      width: 11vmin;
      height: 11vmin;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.45);
      color: #fff;
      font-size: 5.5vmin;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.7;
    }
    #btn-mute:hover { opacity: 1; }
  </style>
</head>
<body shadow>
  <div id="hud">
    <div id="score-label">Score: 0</div>
    <div id="combo-label"></div>
  </div>
  <div id="miss-label">⭕⭕⭕⭕⭕</div>

  <!-- Slow-mo bar -->
  <div id="slowmo" style="position:fixed;bottom:3vh;left:50%;transform:translateX(-50%);z-index:10;
    pointer-events:none;opacity:0;transition:opacity 0.3s;">
    <div style="font-size:clamp(1.5vmin,2vw,2vmin);color:#88ddff;font-weight:bold;text-align:center;
      text-shadow:0 0 10px rgba(100,200,255,0.7);margin-bottom:0.5vmin;">⏳ SLOW MODE</div>
    <div style="width:clamp(15vmin,30vw,30vmin);height:1vmin;background:rgba(255,255,255,0.15);
      border-radius:0.5vmin;overflow:hidden;">
      <div id="slowmo-bar" style="width:100%;height:100%;background:linear-gradient(90deg,#44bbff,#88ddff);
        border-radius:0.5vmin;transform-origin:left;transition:transform 0.05s;"></div>
    </div>
  </div>

  <!-- Main Menu -->
  <div class="overlay" id="menu-main">
    <h1>🍉 Fruit Ninja</h1>
    <access-button access-group="mainmenu" access-order="1">
      <button id="btn-start">START GAME</button>
    </access-button>
  </div>

  <!-- Game Over -->
  <div class="overlay hidden" id="menu-gameover">
    <h1>Game Over</h1>
    <h2 id="final-score">Score: 0</h2>
    <access-button access-group="gameover" access-order="1">
      <button id="btn-restart">PLAY AGAIN</button>
    </access-button>
    <access-button access-group="gameover" access-order="2">
      <button id="btn-menu">MAIN MENU</button>
    </access-button>
  </div>

  <canvas id="trail-canvas"></canvas>
  <button id="btn-mute" title="Mute/Unmute">🔊</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
  <script type="module" src="js/game.js"></script>
</body>
</html>
